{% extends 'base.html' %}

{% block title %}Структура посівних площ{% endblock %}
{% block header %}🌾 Структура посівних площ{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">🏠 На головну</a>
</div>

<div class="container mt-4">
  <div class="row g-3">
    <div class="col-md-4">
      <a href="{{ url_for('fields_structure.index') }}" class="text-decoration-none">
        <div class="card shadow-sm rounded-2 border-success">
          <div class="card-body text-center">
            <h5 class="card-title text-success mb-0">📋 Структура по полях</h5>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-4">
      <a href="{{ url_for('summary_structure.index') }}" class="text-decoration-none">
        <div class="card shadow-sm rounded-2 border-success">
          <div class="card-body text-center">
            <h5 class="card-title text-success mb-0">📊 Загальна структура</h5>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-4">
      <a href="{{ url_for('rotation.index') }}" class="text-decoration-none">
        <div class="card shadow-sm rounded-2" style="border: 1px solid #d8ae4d;">
          <div class="card-body text-center">
            <h5 class="card-title mb-1" style="color: #193b69;">🌱 Сівозміна</h5>
            <p class="card-text text-muted small mb-0">Історія полів за роками · фільтри культур у колонках</p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
{% endblock %}
