{% extends 'base.html' %}

{% block title %}Нові плани{% endblock %}
{% block header %}✏️ Нові плани{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <a href="{{ url_for('plans.hub') }}" class="btn btn-outline-secondary">⬅️ Назад до планів</a>
</div>

<div class="container mt-4">
  <p class="small text-muted">Створення технологічних планів на сезон {{ active_year or '—' }}.</p>
  <div class="row g-3">
    <div class="col-md-6">
      <a href="{{ url_for('planning_workspace.select_cluster') }}" class="text-decoration-none">
        <div class="card shadow-sm rounded-2 border-success">
          <div class="card-body text-center">
            <h5 class="card-title text-success mb-0">📍 Створити план по полю</h5>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-6">
      <a href="{{ url_for('new_plans.bulk_template_select_fields') }}" class="text-decoration-none">
        <div class="card shadow-sm rounded-2 border-success">
          <div class="card-body text-center">
            <h5 class="card-title text-success mb-0">📋 Створити кілька планів за шаблоном</h5>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
{% endblock %}
