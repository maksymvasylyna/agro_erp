name: One-time AgroERP full source history archive

on:
  push:
    branches:
      - backup/snapshot-2026-11-16
    paths:
      - .github/workflows/archive-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect complete repository history and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agroerp_snapshot
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          git bundle create agroerp_snapshot/AgroERP_git_history.bundle --all
          git bundle verify agroerp_snapshot/AgroERP_git_history.bundle
          git archive --format=tar HEAD | gzip -9 > agroerp_snapshot/AgroERP_source.tar.gz
          git show --no-patch --format=fuller HEAD > agroerp_snapshot/COMMIT.txt
          git for-each-ref --format='%(refname:short) %(objectname)' refs/heads refs/remotes/origin refs/tags > agroerp_snapshot/BRANCHES_TAGS.txt
          printf '%s\n' 'AgroERP full repository archive' 'Git bundle contains full accessible Git history and branches.' 'The source.tar.gz is the exact backup branch source tree.' 'Restore full Git repository with: git clone AgroERP_git_history.bundle agro_erp' 'This artifact does not contain the production PostgreSQL database, Render environment secrets or runtime volumes.' > agroerp_snapshot/README.txt
          (cd agroerp_snapshot && sha256sum AgroERP_git_history.bundle AgroERP_source.tar.gz > SHA256SUMS.txt)
      - name: Publish user-downloadable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroERP_source_history_2026-11-16
          path: agroerp_snapshot/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
