name: AgroERP products catalog tests
on:
  pull_request:
    paths:
      - "app.py"
      - "modules/reference/products/**"
      - "tests/test_products_syngenta_catalog.py"
      - "scripts/cleanup_legacy_products_requests_2026.py"
      - "tests/test_legacy_cleanup_guards.py"
      - "wsgi.py"
      - "scripts/backfill_syngenta_packaging_2026.py"
      - "tests/test_syngenta_packaging.py"
      - "scripts/cap_syngenta_packaging_20_2026.py"
      - "tests/test_syngenta_packaging_cap20.py"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "modules/reference/products/**"
      - "tests/test_products_syngenta_catalog.py"
      - "scripts/cleanup_legacy_products_requests_2026.py"
      - "tests/test_legacy_cleanup_guards.py"
      - "wsgi.py"
      - "scripts/backfill_syngenta_packaging_2026.py"
      - "tests/test_syngenta_packaging.py"
      - "scripts/cap_syngenta_packaging_20_2026.py"
      - "tests/test_syngenta_packaging_cap20.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify Syngenta product catalog and normalized ingredients
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "catalog-ci-only"
        run: |
          python -m unittest discover -s tests -p "test_products_syngenta_catalog.py" -v
          python -m unittest discover -s tests -p "test_legacy_cleanup_guards.py" -v
          python -m unittest discover -s tests -p "test_syngenta_packaging.py" -v
          python -m unittest discover -s tests -p "test_syngenta_packaging_cap20.py" -v
