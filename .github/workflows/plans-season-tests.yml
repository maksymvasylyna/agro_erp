name: AgroERP Planning season isolation tests

on:
  push:
    branches: [main, feature/plans-season-isolation]
    paths:
      - "app.py"
      - "modules/plans/**"
      - "modules/reference/fields/**"
      - "tests/test_plans_seasonal.py"
      - "tests/test_fields_seasonal.py"
      - ".github/workflows/plans-season-tests.yml"
  pull_request:
    paths:
      - "app.py"
      - "modules/plans/**"
      - "tests/test_plans_seasonal.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-plan-seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test seasons and plan views on disposable SQLite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-only-ci-not-a-real-secret"
        run: |
          python -m unittest discover -s tests -p "test_plans_seasonal.py" -v
          python -m unittest discover -s tests -p "test_fields_seasonal.py" -v
