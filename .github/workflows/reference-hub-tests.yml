name: AgroERP reference hub design consistency

on:
  pull_request:
    paths:
      - "modules/reference/templates/reference/index.html"
      - "modules/structure/templates/structure/index.html"
      - "templates/base.html"
      - "static/css/agro.css"
      - "tests/test_reference_hub_navigation.py"
      - ".github/workflows/reference-hub-tests.yml"
  push:
    branches: [main]
    paths:
      - "modules/reference/templates/reference/index.html"
      - "modules/structure/templates/structure/index.html"
      - "templates/base.html"
      - "static/css/agro.css"
      - "tests/test_reference_hub_navigation.py"
      - ".github/workflows/reference-hub-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-hub-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify navigation and directory links using temporary SQLite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "reference-hub-ci-only"
        run: python -m unittest discover -s tests -p "test_reference_hub_navigation.py" -v
